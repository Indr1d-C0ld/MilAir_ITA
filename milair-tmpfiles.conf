# MilAir ITA — cartelle in RAM, ricreate a ogni avvio (systemd-tmpfiles).
# Copiare in /etc/tmpfiles.d/milair.conf, sostituendo CHANGEME, poi:
#   systemd-tmpfiles --create /etc/tmpfiles.d/milair.conf
d /run/milair           2770 CHANGEME www-data -
d /run/milair/sessions  2770 CHANGEME www-data -
d /run/milair/cache     2770 CHANGEME www-data -
